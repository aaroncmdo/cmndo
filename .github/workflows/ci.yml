name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  # Journey-Suite (`e2e`-Job) laeuft NIGHTLY statt bei jedem Push — Begruendung im Job-Kommentar
  # bei `e2e:`. 03:30 UTC = nach dem 02:00-Nacht-Cron (Release-Provisionen sind dann schon
  # freigegeben -> der J9-lifecycle-Geld-Guard findet 0 fremde faellige Rows und schiesst scharf)
  # und in der ruhigsten Fleet-Phase (keine lokalen Sessions -> keine Seed-Races auf prod).
  schedule:
    - cron: '30 3 * * *'
  # Manueller Trigger: "ich will den Journey-Beweis JETZT" (z.B. nach einem Journey-PR-Merge).
  # Actions -> CI -> Run workflow  bzw.  gh workflow run CI --ref main
  workflow_dispatch:

# wait-for-vercel-preview pollt Deployment-Status via GITHUB_TOKEN.
# Ohne explizite Grants läuft der Token je nach Repo-Default read-only
# auf contents — dann kippt die Action mit "Resource not accessible by
# integration". Explizite minimal-Grants hier.
permissions:
  contents: read
  deployments: read
  statuses: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.{ts,tsx,js,jsx}', 'public/**/*', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck
        env:
          # tsc --noEmit OOMt im Default-2-GB-Heap auf GH-Runnern. 2026-05-12:
          # 4 GB reichten nicht mehr (Next.js-16-Build-OOM in der TS-Phase),
          # auf 8 GB hochgezogen — gleicher Wert wie deploy-vps.yml ihn nutzt.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # AAR-token-audit (PR #1025): Drift-Bremse gegen nicht-dokumentierte Hex-
      # Verwendungen in src/. Blockt neue `bg-[#xxx]` Klassen + raw inline-hex
      # in `style={{ }}` ohne `var(--brand-*)` Fallback. Siehe
      # scripts/check-token-audit.mjs für Whitelist + Skip-Header-Konvention.
      - name: Token-Audit
        run: npm run check:token-audit

      # use-server-Export-Guard (PR #4439-Nachwehe, 16.07.): 'use server'-Dateien duerfen NUR
      # async functions + type/interface-DEKLARATIONEN exportieren. Ein `export type { X }`-
      # RE-Export liess den Server-Actions-Loader crashen -> ALLE Actions der Datei 500ten
      # (Werkstatt-Embed war seit Deploy tot). tsc/build/vitest sind fuer die Klasse blind.
      - name: use-server-Export-Guard
        run: npm run check:use-server-exports

      # Migration-UTF8 (2026-05-29): jede supabase/migrations/*.sql muss valides UTF-8 sein
      # (verhindert Latin-1-Stubs, die die Supabase-Preview brechen). scripts/check-migration-utf8.mjs.
      - name: Migration-UTF8
        run: npm run check:migration-utf8

      # AAR-tailwind-arbitrary: Drift-Bremse gegen leere Tailwind-Arbitrary-Klassen
      # die den PostCSS-Parser brechen (Width-Utility mit leerem var-Aufruf). Siehe
      # scripts/check-tailwind-arbitrary.mjs.
      - name: Tailwind-Arbitrary
        run: npm run check:tailwind-arbitrary

      # Component-Set-Drift-Bremse (Ratchet): blockt NEUE handgerollte
      # Buttons/Cards/Tables ggue. scripts/component-set-baseline.json.
      # Bestand wird per Boy-Scout abgebaut (-- --update-baseline senkt die
      # Baseline). Siehe AGENTS.md §Komponenten-Set.
      - name: Component-Set-Ratchet
        run: npm run check:component-set -- --ratchet

      # Status-Registry-Drift-Bremse (Ratchet): blockt NEUE inline Status-/Farb-Maps
      # + Status-Farb-Ternaries ggue. scripts/status-registry-baseline.json. Neuer Code
      # nutzt @/lib/status (resolveStatus/statusSlotClass/<StatusBadge domain=.../>).
      # Skip via `// status-registry-skip:`-Header. Siehe AGENTS.md §status-registry.
      - name: Status-Registry-Ratchet
        run: npm run check:status-registry -- --ratchet

      # Termin-Engine-Contract-Drift-Bremse (Ratchet): blockt NEUE direkte
      # Legacy-Filter (.eq('lead_id')/.eq('sv_id')) auf gutachter_termine
      # ausserhalb engine/* ggue. scripts/termin-engine-contract-baseline.json
      # (Baseline 0). Siehe src/lib/termine/engine/CONTRACT.md.
      - name: Termin-Engine-Contract-Ratchet
        run: npm run check:termin-engine-contract -- --ratchet

      # Termin-Bezug-Drift-Bremse (Ratchet): blockt NEUE naive Legacy-Bezug-Filter
      # (.eq/.neq/.in('fall_id'|'claim_id'|'lead_id')) auf gutachter_termine ggue.
      # scripts/termin-bezug-baseline.json — die uebersehen bezug-native Termine
      # (bezug_typ+bezug_id, Legacy-Spalte NULL). Fix: .or(bezugOrExpr(achse,id)) aus
      # @/lib/termine/bezug-filter. Ergaenzt den Contract-Ratchet (der nur .eq('lead_id')/
      # .eq('sv_id') = Engine-API-Disziplin gatet). Siehe AGENTS.md Paragraph Termin-Bezug-Gate.
      - name: Termin-Bezug-Ratchet
        run: npm run check:termin-bezug -- --ratchet

      # Stille-Write-Ratchet: blockt NEUE Supabase-Writes auf schadenstraechtige Tabellen,
      # deren Ergebnis niemand liest, ggue. scripts/silent-write-baseline.json.
      # supabase-js WIRFT NICHT — `await db.from('claims').update(…)` ohne Destrukturierung
      # ist von Erfolg ununterscheidbar. Drei belegte Vorfaelle: DSGVO-Storno (19.07., Antrag
      # lief nach "storniert" weiter), J2-Seed (16.08., 13 Tage lang nichts geloescht),
      # Skizzen-Korrektur (16.08.). Siehe AGENTS.md Paragraph Stille-Write-Gate.
      - name: Stille-Write-Ratchet
        run: npm run check:silent-writes -- --ratchet

      # stop_reason-Drift-Bremse: blockt NEUE erzwungene Tool-Aufrufe (tool_choice),
      # die `stop_reason` nicht pruefen. Reisst eine Antwort das Token-Limit, liefert
      # die Anthropic-API einen HALBEN tool_use-Block — kein Fehler, keine Exception.
      # Mit Fallbacks ausgelesen wird daraus still "nichts gefunden", und der Aufruf
      # meldet Erfolg. Zwei belegte Vorfaelle (18.08.): der Lokalinhalt-Generator
      # verlor 399 von 436 Woertern, flow-intake verschluckte die Schadenmeldung des
      # Kunden (nichts gespeichert, keine Rueckfrage, kein Fehler).
      # ⚠ Ein groesseres max_tokens ist KEIN Ersatz — es verschiebt nur, ab welcher
      # Eingabe es still bricht. Freitext-Antworten sind bewusst NICHT erfasst (dort
      # bricht der Satz sichtbar ab). Siehe AGENTS.md §stop-reason-Gate.
      - name: stop_reason-Ratchet
        run: npm run check:anthropic-stop-reason -- --ratchet

      # RLS-Policy-Ratchet: blockt NEUE permissive CREATE POLICY ohne explizite Rollen-Klausel
      # ggue. scripts/rls-policy-baseline.json. Ohne `TO` ist der Postgres-Default `TO public` —
      # die Policy gilt dann auch fuer authenticator/cli_login_postgres/dashboard_user/
      # supabase_privileged_role (0 App-Traffic, 0 Grants). Der Supabase-Advisor zaehlt
      # `multiple_permissive_policies` je (Tabelle x ROLLE x Action) -> jeder Overlap wird 4x
      # doppelt gezaehlt. Genau das war das 49-%-Rauschen (313 Findings), das B2a
      # (Migration 20260714171501) rausgeraeumt hat; ohne Gate kommt es zurueck.
      # AUSNAHMEN: `AS RESTRICTIVE` (dort ist TO public korrekt) + dynamisches SQL (%I/%s).
      # Reiner File-Scan — kein DB-/Netz-Zugriff (CI hat keine DB-Creds).
      # Siehe AGENTS.md §rls-policy-gate.
      - name: RLS-Policy-Ratchet
        run: npm run check:rls-policies -- --ratchet

      # Dead-Code-Drift-Bremse (knip, Ratchet): blockt NEUE ungenutzte Files +
      # NEUE unused/unlisted Dependencies ggue. scripts/knip-baseline.json.
      # Exports/Types laufen NUR --warn (FP-behaftet: Barrel-Re-Exports +
      # Server-Actions via action={fn}). Dep-Whitelist + Logik in scripts/check-knip.mjs.
      # Siehe AGENTS.md §dead-code-gate + docs/superpowers/specs/2026-05-29-knip-deadcode-audit.md.
      - name: Knip-Dead-Code-Ratchet
        run: npm run check:knip -- --ratchet

      # Redirect-Stub-Drift-Bremse (Ratchet): blockt NEUE reine redirect()-/permanentRedirect()-
      # only page.tsx (kein Content-return) ggue. scripts/redirect-stub-baseline.json. Solche
      # Stubs rendern auf prod eine LEERE 200-Shell (React #310, kein Redirect) — kein Build/
      # tsc/Ratchet faengt das, nur ein Prod-Render-Smoke. Fix: HTTP-308 via next.config.ts
      # redirects() + page.tsx loeschen. Siehe AGENTS.md §Redirect-Stub + BROADCAST-redirect-stub-antipattern.
      - name: Redirect-Stub-Ratchet
        run: npm run check:redirect-stubs -- --ratchet

      # Metadata-Merge: Next merged `metadata` nur FLACH — ein eigener openGraph/
      # twitter-Block ERSETZT den des Layouts komplett, inklusive `images`. Die Klasse
      # trat im SEO-Audit 18.08. FUENFMAL auf (canonical #5352, feed-types #5357,
      # og/twitter #5369, autounfall #5384) und kostete u.a. 167 Seiten ihr
      # Vorschaubild — kein Build/tsc/anderer Ratchet faengt das.
      # Siehe AGENTS.md §Metadata-Merge-Gate.
      - name: Metadata-Merge-Ratchet
        run: npm run check:metadata-merge -- --ratchet

      # Stadt-Linknetz: blockt tote Links (404 fuer Nutzer UND Crawler) und Waisen
      # (Stadtseiten, die von keiner anderen Stadtseite aus erreichbar sind) im
      # /kfz-gutachter/[stadt]-Netz. Vor P3 waren 41 der 92 Seiten Waisen, waehrend
      # eine Stadt 74 eingehende Links bekam — der Durchschnitt (6,0) war dabei
      # identisch und als Kennzahl wertlos. Rein statisch, kein Netz, keine DB.
      # Einseitige Kanten blocken bewusst NICHT: sie sind in einem distanzbasierten
      # Netz strukturell normal. Der Step kommt erst jetzt dazu, weil das Gate bis
      # zur Reziprozitaet (siegen war Waise) nicht gruen werden konnte — ein Gate,
      # das von Tag eins rot ist, wird ignoriert. Siehe P3-Spec §A3.
      - name: Stadt-Linknetz
        run: npm run check:stadt-linknetz -- --check

      # Fixed-Overlay-Safe-Area-Bremse (Ratchet): ein `position: fixed`-Overlay steht
      # ausserhalb des Layout-Flusses und beansprucht seine Bildschirmecke dauerhaft —
      # Seiteninhalt darunter ist NICHT klickbar (der Klick trifft das Overlay). 2x real:
      # ZB1-Footer 16.07. + Embed-Wizard-"Weiter" 11.08. (1280x720), beide nur per
      # Hand-Smoke gefunden. Gate 1 (hart, Baseline 0): wer den FAB mountet, braucht
      # lg:pb-20 auf dem scrollenden <main>. Gate 2 (grandfathered): NEUE unten-rechts
      # fixierte Elemente brauchen eine bewusste Entscheidung.
      # Siehe AGENTS.md §Fixed-Overlay-Gate + globals.css (.has-corner-pill-Nachbarblock).
      - name: Fixed-Overlay-Safe-Area-Ratchet
        run: npm run check:fixed-overlay -- --ratchet

      # E2E-Toplevel-FS-Bremse (Ratchet): blockt NEUE Playwright-Specs, die einen Seed per
      # readFileSync auf MODUL-EBENE lesen. Fehlt die Datei, wirft das schon beim Import ->
      # die gesamte Playwright-COLLECTION crasht und reisst ALLE anderen Journey-Smokes mit.
      # Genau das hielt main-e2e vom 05.-11.08. dauerhaft rot (feststellung-flow-gate).
      # Siehe AGENTS.md §E2E-Toplevel-FS-Gate.
      - name: E2E-Toplevel-FS-Ratchet
        run: npm run check:e2e-toplevel-fs -- --ratchet

      # Query-Drift-Bremse (Ratchet): blockt NEUE Queries auf nicht-existente Spalten —
      # Filter-/Order-Params (.order('created_at') auf flow_links/auftraege), insert/update-
      # Keys (pflichtdokumente.datei_url) und top-level select-Spalten — gg. database.types.ts
      # + scripts/query-drift-baseline.json. Solche Queries werfen PostgREST-400, der Caller
      # verschluckt den Fehler -> stiller Feature-Ausfall (belegt 15./16.07.: LexDrive-Anhaenge,
      # Pflicht-Slots nie 'hochgeladen', Kanzlei-Wunsch blockiert, KB-Kundentermine leer,
      # Abrechnung 'Unbekannt' — #4396/#4420/#4452/#4455). Types koennen der DB nachhinken:
      # Finding = Query fixen ODER Types regenerieren ODER bewusst --update-baseline.
      # DB-seitiges Pendant fuer Embed-Hints: check:query-parse (braucht .env.local, nicht CI).
      - name: Query-Drift-Ratchet
        run: npm run check:query-drift -- --ratchet

      # Flag-Drift-Bremse (Ratchet): blockt NEUE CHECK-invalide Status-Literale in
      # Supabase-Writes/Filtern (z.B. .update({status:'geplant'}) auf gutachter_termine)
      # ggue. scripts/flag-drift-baseline.json. Postgres verwirft solche Writes -> stiller
      # Fehlschlag (kein Build/tsc faengt das; belegt 05.07. geplant/kunde_storniert).
      # Siehe AGENTS.md Paragraph Flag-Drift-Gate.
      - name: Flag-Drift-Ratchet
        run: npm run check:flag-drift -- --ratchet

      # Flow-erhebt-felder-Ratchet: jeder erhebt_felder-Eintrag der FlowLink-Matrix muss eine echte,
      # NICHT default-behaftete, NICHT abgeleitete leads-Rohspalte sein — sonst gatet der Step nie
      # sauber (Symptom 1 hat_vorschaeden-Default / Symptom 2 *_effektiv-Fallback). Hard-0, kein DB.
      # Siehe docs/superpowers/specs/2026-07-21-flowlink-operative-vollstaendigkeit-design.md Paragraph 2.6.
      - name: Flow-erhebt-felder-Ratchet
        run: npm run check:flow-erhebt-felder -- --ratchet

      # FG1-Ratchet: blockt NEUE direkte claims.operative_status-Writes ausserhalb der
      # State-Machine-Engine (.from('claims').update({operative_status})) ggue.
      # scripts/operative-status-writes-baseline.json. Solche Direkt-Writes umgehen
      # transitionFallStatus -> kein fall.status_changed-Event/Timeline/phase_transitions
      # (Werkstatt-Abschluss-Bypass 17.07.). Siehe AGENTS.md Paragraph Operative-Status-Write-Gate.
      - name: Operative-Status-Write-Ratchet
        run: npm run check:operative-status-writes -- --ratchet

      # C2-Ratchet (Ein Intake): blockt NEUE direkte createLead-Aufrufe ausserhalb des
      # Intake-Moduls ggue. scripts/intake-funnel-baseline.json. Nur `createCase`
      # garantiert neben dem Lead auch den FlowLink (C2 Paragraph 7#1) — ein roher
      # createLead-Aufruf erzeugt einen Interessenten OHNE Kunde-Kanal, der keinen Weg
      # zurueck in seinen Vorgang hat. Siehe AGENTS.md Paragraph Intake-Funnel-Gate.
      - name: Intake-Funnel-Ratchet
        run: npm run check:intake-funnel -- --ratchet

      # i18n-Drift-Bremse (Strategie B): erzwingt identische Key-Sets ueber alle
      # 6 Locales. Verhindert, dass untersetzte i18n-Keys live gehen — next-intl
      # rendert sonst den Key-Pfad statt eines Textes. Siehe scripts/i18n/check-complete.mjs.
      - name: i18n-Key-Completeness
        run: npm run check:i18n

      # i18n-Render-Check: kompiliert jede Message durch intl-messageformat (next-intls
      # Engine). Faengt kaputte ICU-/Plural-Syntax + ungeschlossene <tags>, die
      # check:i18n (nur Key-Paritaet) NICHT sieht und die next-intl zur Laufzeit werfen.
      # Siehe scripts/i18n/check-render.mjs (offline, SKIP-Liste fuer dokumentierte Faelle).
      - name: i18n-Render-Check
        run: npm run check:i18n-render

      # i18n-Coverage-Gate: blockt NEUE dynamisch adressierte i18n-Keys ohne Label.
      # Der Code baut Keys zur LAUFZEIT aus TS-Unions (subphase-visibility.ts:
      # `${'subKunde'|'subIntern'}.${lifecycle.subPhase}`) — fehlt ein Union-Wert in den
      # Messages, wirft next-intl MISSING_MESSAGE und die UI rendert den ROHEN KEY.
      # check:i18n faengt das NICHT (prueft nur Paritaet ZWISCHEN Locales: fehlt der Key in
      # ALLEN 6, ist die Paritaet erfuellt -> gruen). Prod-Beleg 19.07.:
      # phasen.subIntern.reparatur_terminfindung, dazu filmcheck/qc-pruefung/
      # anschlussschreiben/nachbesichtigung-laeuft. Baseline 0 (harter Gate).
      # Siehe AGENTS.md Paragraph i18n-Coverage-Gate.
      - name: i18n-Coverage-Ratchet
        run: npm run check:i18n-coverage -- --ratchet

      # AAR-921 RLS-Drift-Bremse (15.05.2026): findet SECDEF-Functions in
      # pg_policies, denen GRANT EXECUTE TO authenticated fehlt. Drift entsteht
      # durch CREATE OR REPLACE FUNCTION ohne Grant-Wiederherstellung — Inzident
      # AAR-894 (14.05.2026): SV-Plan leer, Cron-Reminders silent skip. Siehe
      # scripts/check-rls-function-grants.mjs + Migration 20260515111313.
      - name: RLS-Function-Grants
        run: node scripts/check-rls-function-grants.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # RLS-Haertung (27.06.2026): Claim-View-Gate-Drift-Bremse. Stellt sicher, dass die
      # 7 Claim-Read-Views row-gegatet bleiben (claim_sichtbar_fuer_aktuellen_user) und
      # keine anon-lesbar wird. Backing-RPC audit_claim_view_gates(). Siehe
      # scripts/check-claim-view-rls.mjs + docs/superpowers/specs/2026-06-27-rls-haertung-claim-views-design.md.
      - name: Claim-View-RLS
        run: node scripts/check-claim-view-rls.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # RLS-Haertung Schritt 2 (rls-safety-net 29.06.2026): Tabellen-RLS-Leak-Check. Pendant zum
      # Claim-View-RLS-Check, aber fuer die TABELLEN-Schicht (RLS-Policies statt View-Gates).
      # Tabellen-RLS kann NICHT via DB-Funktion getestet werden (postgres/service_role bypassen RLS;
      # SET ROLE geht nicht in SECURITY DEFINER) -> echter Nobody-User (eingeloggt, besitzt nichts)
      # muss aus jeder Claim-Tabelle 0 Zeilen sehen. Siehe scripts/check-claim-table-rls.mjs.
      - name: Claim-Table-RLS
        run: node scripts/check-claim-table-rls.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Claims-Spalten-Cap (14.07.2026): SPALTEN-Schicht. Die beiden Checks oben pruefen, ob
      # jemand ZEILEN sieht, die er nicht darf — nie, ob er von einer erlaubten Zeile ZU VIELE
      # SPALTEN sieht. Genau da lag der Bug: `authenticated` hatte table-weites SELECT auf
      # claims, also las jeder Kunde/SV/Kanzlei die internen Spalten seines eigenen Falls
      # (interne_notizen, lead_preis_netto = Lead-Einkaufspreis, marketing_provision,
      # kanzlei_honorar) per PostgREST direkt aus. Dieser Check haelt beide Schutzschichten
      # stabil: Column-GRANT-Cap (Mig 20260714220455) + CASE-Maskierung in v_claim_base
      # (Mig 20260714215721) — und blockt neue claims-Spalten, die weder gegrantet noch als
      # intern deklariert sind (die waeren fuer User-Clients still unsichtbar).
      # Backing-RPC audit_claims_column_grants(). Siehe scripts/check-claims-column-grants.mjs.
      - name: Claims-Column-Grants
        run: node scripts/check-claims-column-grants.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Fundament-Haertung (Audit 2026-07-07): systematischer anon-Exposure-Guard.
      # Schliesst die Luecke der claim-zentrierten View-Guards (die security_invoker +
      # matviews + Views-ohne-claim_id ausschliessen — genau der v_partner_billing-Pfad).
      # Default-Deny ueber ALLE anon-lesbaren public-Views: faengt jede, die einem echten
      # anon Zeilen zeigt (anon-REST) ODER security_invoker=false (DEFINER) ist.
      # Siehe scripts/check-anon-exposure.mjs + Backing-RPC audit_anon_readable_views().
      - name: Anon-Exposure-Guard
        run: node scripts/check-anon-exposure.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Anon-Grant-Ratchet (Grant-Audit 15.07.2026): blockt NEUE anon-SELECT-Grants auf sensible
      # Spalten-MUSTER (iban/steuer/geburtsdatum/OAuth-Token/secret/passwort/provision/honorar/notiz)
      # in public-Basistabellen. Ergaenzt den Anon-Exposure-Guard (der ZEILEN via anon-lesbare Views
      # faengt): RLS schuetzt nur Zeilen — ein table-weiter anon-Grant + ein spaeterer anon-Policy-Zweig
      # legt die Spalte offen (latent). Verallgemeinert audit_claims_column_grants auf die ganze anon-
      # Klasse. Baseline+Boy-Scout. Backing-RPC audit_anon_sensitive_grants(). Nur bei SQL-Diff aktiv.
      # Siehe scripts/check-anon-sensitive-grants.mjs + AGENTS.md §Anon-Grant-Gate.
      - name: Anon-Grant-Ratchet
        run: node scripts/check-anon-sensitive-grants.mjs --ratchet
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Reachability-Ratchet (Reachability-Audit 16.07.2026): blockt NEUE anon-SELECT-Policies
      # mit einem OR-Zweig OHNE auth.uid() (true-anon liest echte Zeilen) auf Tabellen mit
      # Kontakt-PII (email/telefon/kennzeichen/geburt/iban/…). Ergaenzt den Anon-Grant-Ratchet
      # (Spalten-NAMEN-Achse) um die Policy-REACHABILITY-Achse — die claims/auftraege/leads-Klasse
      # war Grant-basiert, gutachter_finder_anfragen (Mig 20260716200848) war Policy-basiert und
      # der Grant-Ratchet fing es nicht (telefon/email nicht im Namensmuster). Baseline+Boy-Scout.
      # Backing-RPC audit_anon_reachable_pii(). Nur bei SQL-Diff aktiv. Siehe
      # scripts/check-anon-reachability.mjs + AGENTS.md §Reachability-Gate.
      - name: Reachability-Ratchet
        run: node scripts/check-anon-reachability.mjs --ratchet
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Write-Reachability-Ratchet (Write-Reachability-Audit 19.07.2026): blockt NEUE PERMISSIVE
      # authenticated-WRITE-Policies (INSERT/UPDATE/DELETE) mit einem OR-Zweig OHNE auth.uid()/
      # Scoping-Helper -> jeder eingeloggte User kann fremde/beliebige Zeilen schreiben (cross-user/
      # cross-tenant Write). Write-Gegenstueck zum Reachability-Ratchet (SELECT/true-anon-Achse).
      # Ergaenzt die WURZEL (default-closed GRANT-Achse) um die POLICY-Reachability-Achse fuer Writes.
      # Aktuell 0 echte Lecks (Baseline 2 = bewusste oeffentliche Finder-Submits). Backing-RPC
      # audit_authenticated_write_reachable(). Nur bei SQL-Diff aktiv. Siehe
      # scripts/check-authenticated-write-reachability.mjs + AGENTS.md §Write-Reachability-Gate.
      - name: Write-Reachability-Ratchet
        run: node scripts/check-authenticated-write-reachability.mjs --ratchet
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Migration-File-Drift (19.08.2026): faengt die GEGENRICHTUNG der ueblichen Twin-Drift —
      # eine Migration ist getrackt + auf prod appliziert, aber ihr File fehlt im Repo (Regel 2
      # Schritt 4 vergessen). Das Schema ist dann nicht reproduzierbar, und der Preview-Replay
      # stirbt mit 42P01, sobald eine SPAETERE Migration eines der fehlenden Objekte anfasst —
      # auf JEDEM PR mit Migrations-Diff, nicht nur beim Verursacher. Am 19.08. zweimal
      # passiert (7 Files, PRs #5393 + #5412).
      # ⚠ BEWUSST --warn, NICHT --ratchet: die Drift entsteht AUSSERHALB eines PRs (per
      # apply_migration), ein blockierendes Gate wuerde also unbeteiligte Lanes rot faerben.
      # Die Warnung erreicht den Verursacher trotzdem — sie erscheint in JEDEM PR, also auch
      # in seinem naechsten. Nach einer Beobachtungsphase kann daraus --ratchet werden.
      # Backing-RPC audit_migration_versions(). Ohne Secrets: sauberer Skip (exit 0).
      # Siehe scripts/check-migration-files.mjs + scripts/migration-files-baseline.json.
      - name: Migration-File-Drift (warn)
        run: node scripts/check-migration-files.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Query-Parse-Drift-Bremse (14.07.2026): faengt tote PostgREST-Queries, die still HTTP 300/400
      # liefern (tote Spalte / fehlende Relation / mehrdeutiger Embed / fehlende Tabelle) und deren
      # Fehler im Code verschluckt wird (`const { data } = await …`). Ausloeser: ein FK machte einen
      # Embed mehrdeutig -> 6+ Surfaces 6 Tage still tot (Makler-Leads, SV-Zuweisung-404, Finance …).
      # Jede statische Query wird per select&limit=1 gegen die DB "trockengeschossen" (PostgREST als
      # Orakel, 0 FP). Blockt NEUE gg. scripts/query-parse-baseline.json; Boy-Scout senkt.
      # Ohne DB-Keys skippt das Script (exit 0). Siehe scripts/check-query-parse.mjs.
      # NEU (14.07.) → erster Rollout mit continue-on-error: der Guard LÄUFT + meldet, blockt aber
      # noch nicht. Grund: er trockenschiesst gegen die CI-DB; sollte deren Schema (Preview-Branch)
      # von prod abweichen, wuerde die prod-generierte Baseline nicht matchen und ALLE PRs faelsch-
      # lich roten. Sobald ein grüner Lauf bestaetigt, dass CI-DB == Baseline-DB: continue-on-error
      # entfernen (dann blockt er wie claim-view-rls/anon-exposure).
      - name: Query-Parse-Guard
        run: node scripts/check-query-parse.mjs --ratchet
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build
        run: npm run build
        env:
          # 2026-05-12: 4 GB → 8 GB. Next.js 16 Build OOMte in der
          # "Running TypeScript ..."-Post-Compile-Phase (FATAL ERROR:
          # heap out of memory) — der eigentliche Compile war grün.
          # Gleicher Heap wie deploy-vps.yml, sonst ist CI rot obwohl
          # der Production-Deploy durchläuft.
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  vitest:
    # Test-Drift-Bremse: ci.yml faehrt sonst NIE `vitest run` -> staging sammelt still
    # Test-Breakage, die <30 Min spaeter auf prod steht (19.07. gemessen: 19 rote Files /
    # 31 Tests, wachsend). Laeuft PARALLEL zum build (kein needs), auf PRs + push. Blockt
    # NEUE rote Test-Files ggue. scripts/vitest-baseline.json (file-level, --retry=2 gegen
    # Flake). Boy-Scout: File fixen + Baseline senken. Siehe AGENTS.md §test-gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Vitest-Test-Drift-Ratchet
        run: npm run check:vitest -- --ratchet
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # claimondo-marketing/ ist ein eigener Top-Level-Build mit eigenem
      # package.json, eigenen node_modules und eigener vitest.config.ts. Der
      # Root-Runner sieht ihn nicht (include: src/**), gebaut wird er in CI
      # ebenfalls nicht — seine 23 Test-Files liefen damit NIRGENDS.
      #
      # Das faellt genau dann auf, wenn man sich auf sie verlaesst: die
      # Stadt-Stammdaten (150 Eintraege, je 12 Felder) haengen komplett an den
      # Invarianten in lib/kfz-gutachter/staedte.test.ts — u.a. daran, dass
      # Landgericht und Rechtsanwaltskammer sich ueber alle Staedte hinweg
      # nicht widersprechen. Eine falsche Gerichtszuordnung ist auf der Seite
      # nicht zu sehen und bricht keinen Build; in P1 stand sie auf 31 von 84
      # Seiten. Ohne diesen Schritt war die Absicherung dagegen eine Datei,
      # die zufaellig jemand lokal ausfuehrt.
      #
      # Ohne Ratchet/Baseline, weil der Bestand beim Verdrahten am 17.08.2026
      # vollstaendig gruen war (23 Files / 196 Tests) — es gibt keine Schuld
      # zu grandfathern, und ein rotes File soll hier sofort blocken.
      # npm install statt npm ci — dieselbe Begruendung wie in
      # deploy-vps-marketing.yml: das Lockfile des Marketings fuehrt die
      # Transitive @swc/helpers nicht, und `npm ci` bricht darauf ab
      # ("Missing: @swc/helpers@0.5.23 from lock file"). Der Deploy loest es
      # seit jeher so; ein abweichender Weg hier haette nur bedeutet, dass CI
      # und Deploy verschiedene Baeume installieren.
      - name: Marketing-Deps
        run: npm install --no-audit --no-fund
        working-directory: claimondo-marketing
      - name: Marketing-Unit-Tests
        run: npx vitest run
        working-directory: claimondo-marketing

  e2e:
    # E2E laeuft gegen den DEPLOYTEN Stand auf app.claimondo.de — deshalb NIE auf pull_request:
    # dort testete der Job den Prod-Stand gegen den (nicht deployten) PR-Branch -> systematisch rot
    # (doc40-cards-clickable.spec.ts sagt das im Header selbst: "Asserts werden erst gruen, wenn
    # deployed"). Der `build`-Job bleibt auf PRs required. Manuelle Live-Smokes s.
    # playwright.config.ts testIgnore. Trigger seit 11.08.: nightly + workflow_dispatch (s. unten).
    # NIGHTLY + MANUELL statt push (11.08.): der Job lief bei jedem push:main/staging — kam aber
    # bei der Fleet-Frequenz NIE durch. Gemessen an den letzten 37 staging/main-Laeufen:
    # 21 cancelled · 10 failure · 0 success. Ursache ist NICHT Rot in den Journey-Steps, sondern
    # die Queue: `cancel-in-progress: false` (s.u.) cancelt zwar keine LAUFENDEN Jobs, aber GitHub
    # haelt pro concurrency-group nur EINEN wartenden Lauf — jeder neuere verdraengt den wartenden.
    # Bei ~6 Releases in 2 Minuten kommt ein 15-20-minuetiger e2e-Job schlicht nie dran; der
    # Journey-Waechter wachte faktisch nicht (und erzeugte dabei prod-Seed-Last + cancelled-Rauschen).
    # Der Job GATET NICHTS (laeuft post-merge, informativ) -> nightly erfuellt seinen Zweck als
    # REGRESSIONS-Waechter vollstaendig, laeuft garantiert durch und trifft die ruhigste Fleet-Phase
    # (keine parallelen lokalen Seed-Laeufe -> kein Fixture-Race). Fuer sofortiges Feedback nach
    # einem Journey-PR: `workflow_dispatch` (Actions -> CI -> Run workflow).
    # ⚠ NICHT auf `push` zurueckstellen, ohne die Frequenz-Messung zu wiederholen.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # Serialisiert die prod-E2E-Laeufe: staging + main pushen beide gegen DIESELBE prod-App
    # (app.claimondo.de) + denselben festen Seed-State (reparatur-weg-e2e-seed.mjs = feste
    # @claimondo.test-Konten + feste FIN). Liefen zwei Laeufe parallel (gebuendelte Merges ->
    # mehrere push:staging/main gleichzeitig), racten sie den Seed -> reparatur-weg-e2e-smoke
    # cross-run-flaky (mal Login-Race = Passwort ueberschrieben, mal KVA-Zustand-Race). J1
    # (golden-path-deep, eigene deterministische UUID-Fixtures) blieb stets gruen. EIN fester
    # group-Name (KEIN github.ref) -> staging UND main teilen die Gruppe -> nie 2 parallel.
    # cancel-in-progress:false = queue: jeder Lauf faehrt seinen Journey-Step VOLLSTAENDIG (kein
    # Mid-Run-Cancel = verlaesslicher B1-Nachweis); Verzoegerung unkritisch (e2e informativ, gated
    # nichts). Beobachtet 31.07. (4 parallele Laeufe: J1 stets gruen, J4 cross-run-flaky). b2-Marker.
    concurrency:
      group: prod-e2e-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: build
    # Hard-Cap gegen Runaway: die Suite (110 Tests, workers:1, 30s/Test + retries:1) laeuft
    # strukturell 15-40 min. Ohne Cap konnte ein haengender/rot-schleifender Run bis zum
    # GH-6h-Limit einen Runner blockieren -> CI-Stau + andere PR-Builds langsam (11.07.).
    #
    # 20 -> 45 (12.08.): Das 20er-Cap war GEGEN DIE EIGENE 15-40-min-Schaetzung gesetzt und
    # schnitt den letzten Step deshalb SYSTEMATISCH ab. Gemessen am ersten Nightly (Run
    # 31565748829) + am dispatch-Lauf davor (31535504632) — in BEIDEN identisch:
    #   Setup ~1:40 | alle 10 Journey-Steps zusammen ~4:00 | "Run E2E Tests" >14:30 -> Kill.
    # Nicht die Journeys fressen das Budget (die sind schnell), sondern der Sammel-Step, der
    # nie fertig wurde -> die Nicht-Journey-Specs (routes/service-pitch/cmm44/doc40 ...) sind
    # faktisch NIE gelaufen. 45 = eigene Obergrenze (40) + Setup/Journeys (~6).
    # Der urspruengliche Grund fuer das enge Cap ist mit #5165 entfallen: der Job haengt nicht
    # mehr an jedem push, sondern laeuft nightly 03:30 + on-demand -> er blockiert keinen
    # PR-Build mehr. Runaway-Schutz bleibt (45 min statt GH-6h).
    #
    # 45 -> 90 (20.08.): Das 45er-Cap hat den Sammel-Step WEITER systematisch abgeschnitten —
    # dieselbe Diagnose wie beim 20er, nur eine Stufe spaeter. Belegt an BEIDEN bisherigen
    # nightly-Laeufen (19.08. Run 32271... / 20.08. Run 32330526194), in beiden identisch:
    #   Setup+Journeys ~6:00 (alle 10 Journeys GRUEN) | "Run E2E Tests" 39:30 -> Kill bei 45.
    # Der Grund ist Wachstum, nicht Haengen: die Kalibrierung oben rechnet mit **110 Tests**,
    # das Log vom 20.08. meldet "Running 199 tests using 1 worker" (+81 %). Bei workers:1
    # skaliert die Laufzeit linear -> 40 min * 199/110 = ~72 min. 90 = 72 + Puffer fuer
    # retries:1 und Wachstum bis zur naechsten Nachfuehrung.
    # ✅ NACHGEMESSEN (20.08., dispatch-Lauf 32362782482 mit genau diesen Aenderungen) —
    # die Hochrechnung oben (~72 min) ist damit erledigt:
    #   Sammel-Step "Run E2E Tests"  11:28:01 → 12:14:14  =  46:13
    #   e2e-Job gesamt               11:22:58 → 12:14:26  =  51:28
    # Die Suite lief ERSTMALS vollstaendig durch. Das alte 45er-Cap war um gut EINE Minute
    # zu knapp — deshalb sah es wie „haengt" aus, obwohl sie fast fertig war.
    # 90 bleibt: 51:28 + Puffer fuer Retry-Durchlaeufe (die Suite ist aktuell rot, retries:1
    # kostet zusaetzliche Zeit) und fuer weiteres Testwachstum.
    # ⚠ Bilanz desselben Laufs: 55 passed / 45 failed / 95 skipped. Die 45 sind NEU SICHTBAR,
    # nicht neu entstanden — sie lagen hinter dem Timeout. Grobe Einordnung: ~14 sind
    # Marketing-Specs, die gegen PLAYWRIGHT_BASE_URL=app.claimondo.de laufen, obwohl sie
    # claimondo.de pruefen (llms.txt liefert dort 404 -> HTML); ~13 sind App-Specs mit
    # bisher UNUNTERSUCHTER Ursache.
    # ⚠ Und die eigentliche Lehre: ein Cap, das an einer Testzahl kalibriert wurde, veraltet
    # mit jedem neuen Spec. Wer Tests ergaenzt, prueft diese Rechnung mit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Kein Vercel-Preview-Wait mehr — E2E läuft gegen app.claimondo.de (Production-VPS).
      # PRs werden nach Merge auf main getestet, nicht gegen Preview-Deploys.

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Fundament B2: Journey-Smoke-Fixture fuer J4 (Reparatur-Weg) seeden. Baut den
      # Ausgangszustand (vermittelt, VOR KVA) mit @claimondo.test-Wegwerf-Konten (Regel 4:
      # telefon=NULL). Ohne diesen Step crasht reparatur-weg-e2e-smoke.spec.ts beim
      # top-level readFileSync('.reparatur-weg-e2e-seed.json'). Seed liest process.env (kein .env.local im CI).
      - name: Seed reparatur-weg E2E-Fixture (J4 Journey-Smoke)
        run: node scripts/smoke/reparatur-weg-e2e-seed.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Fundament B1: die Journey-Smokes (J1-deep + J4) ZUERST + isoliert fahren = der eigentliche
      # gruene B1-Gate-Nachweis. Grund: die volle Suite ("Run E2E Tests" unten, 157 Tests, 1 worker)
      # laeuft strukturell ueber das 20-min-Job-Cap -> Job wird gecancelt, BEVOR die (spaet
      # einsortierten) Journey-Smokes drankommen (beobachtet 29.07.). Dieser fokussierte Step laeuft
      # in Minuten und liefert grün/rot fuer J1+J4 verlaesslich. reparatur-weg-Seed steht (Step davor).
      # NUR golden-path-deep (J1) + reparatur-weg-e2e-smoke (J4-Primaer, voller end-to-end). Die drei
      # reparatur-weg-Specs teilen EINEN Seed-Claim (.reparatur-weg-e2e-seed.json); reparatur-weg-e2e-smoke
      # laeuft alphabetisch zuerst + faehrt den Claim durch den ganzen Flow (KVA->Freigabe->Abschluss) ->
      # die kva-Varianten (betrag-pflicht/ablehnung-loop) finden den VOR-KVA-Zustand nicht mehr (Button
      # "Kostenvoranschlag hochladen" weg = Test-Isolations-Problem, NICHT Journey-Bug — verifiziert:
      # reparatur-weg-e2e-smoke selbst passed, waere es das P4-sa-Gate wuerde auch es failen). Beide
      # Laeufe 30.-31.07. (c5c8320a + 8c6de199). kva-Varianten brauchen eigene Seeds = Follow-up (b2-Marker).
      - name: Fundament B1 Journey-Smokes (J1-deep + J4)
        run: npx playwright test golden-path-deep-prod reparatur-weg-e2e-smoke --project=chromium --reporter=line
        env:
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          RUN_GOLDEN_PATH_DEEP: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_ADMIN_TOTP_SECRET: ${{ secrets.TEST_ADMIN_TOTP_SECRET }}
          TEST_KB_TOTP_SECRET: ${{ secrets.TEST_KB_TOTP_SECRET }}
          TEST_DISPATCH_TOTP_SECRET: ${{ secrets.TEST_DISPATCH_TOTP_SECRET }}
          # 21.08.: TEST_SV_EMAIL/_PASSWORD BEWUSST NICHT MEHR durchgereicht — aus genau dem
          # Grund, der zwei Bloecke weiter unten schon fuer KB/Dispatch/Kanzlei steht: ein
          # unbesetztes Secret rendert als '' und ueberschreibt damit den (korrekten) Default.
          # Belegt am ersten vollstaendig durchgelaufenen nightly (Lauf 32445807331): genau die
          # 8 `Gutachter Routes` in routes.spec.ts rot, je ~17 s Timeout — waehrend dieselben
          # 8 Tests LOKAL gegen dieselbe prod-Instanz in 20,1 s gruen sind (frischer Login,
          # playwright/.auth geloescht). Gleicher Code, gleiche Seiten; der einzige Unterschied
          # war dieses Secret. Admin bleibt durchgereicht — dort traegt es nachweislich einen
          # gueltigen Wert (Admin-Routen sind gruen).
          # Das TOTP-Secret bleibt: es ist ein echtes no-op, solange unbesetzt (undefined -> MFA-Skip).
          TEST_SV_TOTP_SECRET: ${{ secrets.TEST_SV_TOTP_SECRET }}

      # Fundament Journey-Suite J9 (Honorar/Provision) — DB-harte Smokes: provisionen-verrechnung
      # (Provisions-Erzeugungs-Trigger, 8 Attributions-Faelle) + provisionen-staffel (Staffel-Boni).
      # Rein DB (kein Browser/Comms/Cron), self-seeding + FK-sicher self-cleaning via Marker
      # (SMOKE-PROV / SMOKE-STAFFEL-LC, Crash-safe) — dasselbe Wegwerf-in-prod-DB-Muster wie J4.
      # Der "opt-in nie in CI"-Spec-Kommentar war die Vorsichts-Default VOR der Journey-Suite (D-Phase);
      # CI-tauglich, weil self-cleaning + die concurrency-Group (`prod-e2e-smoke`) serialisiert die
      # e2e-Laeufe -> kein Fixture-Cleanup-Cross-Run-Race. SEIT 05.08. AUCH lifecycle (Aaron-Entscheid,
      # DECISIONS 05.08.): der Spec schiesst den ECHTEN globalen Release-Cron, aber hinter einem
      # Fremd-Effekt-Precheck-GELD-GUARD (Muster netzwerk-release-scharf-smoke.mts) — wuerde ein Schuss
      # eine FREMDE faellige/storno-faellige pending-Provision flippen, skippt DIESER Lauf sichtbar
      # (selten; der Nacht-Cron raeumt das Fenster). Kein Produkt-Change am Release-Runner.
      # CRON_SECRET nur fuer den lifecycle-Trigger noetig.
      - name: Fundament Journey-Smoke J9 (Provisionen, DB-hart)
        run: npx playwright test provisionen-verrechnung-smoke provisionen-staffel-smoke provisionen-lifecycle-smoke --project=chromium --reporter=line
        env:
          RUN_PROVISION_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Fundament Journey-Suite J8 (Onboarding je Rolle) — 2FA-Enroll: die Dispatch-Rolle richtet per UI
      # einen TOTP-Faktor ein (KontoSicherheitPanel/TotpEnrollCard, von keiner anderen Smoke abgedeckt)
      # + wird danach beim Login 2FA-gechallenged. Konto-isoliert (smoke-enroll@claimondo.de, kein
      # Comms/Booking). Der Seed-Step setzt das Konto VOR dem Lauf faktorfrei zurueck (stateful self-reset
      # je Lauf; Seed liest process.env-first, .env.local nur lokal). RUN_2FA_ENROLL_SMOKE gatet den Spec.
      - name: Seed 2FA-Enroll-Fixture (J8)
        run: node scripts/seed-smoke-enroll.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fundament Journey-Smoke J8 (2FA-Enroll)
        run: npx playwright test 2fa-enroll-smoke --project=chromium --workers=1 --reporter=line
        env:
          RUN_2FA_ENROLL_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de

      # Fundament Journey-Suite J5 (Kasko/Selbstzahler-Reparatur-Phase) — die interne Fallakte eines
      # Kasko-Claims mit gesetzter Werkstatt zeigt die Reparatur-Lane (Stepper "Terminfindung"), NICHT
      # "SA-Unterschrift offen" (#4471). Der Seed-Step legt je Lauf einen frischen Wegwerf-Claim an
      # (eigene Wegwerf-Werkstatt statt gedrifteter prod-Fixture badecb82 — die existiert nicht mehr;
      # @claimondo.test/telefon=NULL, self-cleaning via Marker). Ersetzt den frueher fixen prod-Claim
      # 39734007 (werkstatt_id auf NULL gedriftet). RUN_KASKO_SMOKE gatet den Spec; loginContextOrSkip
      # ('admin') aal1 (test-admin traegt keinen TOTP-Faktor; MIT Secret wuerfe completeMfa mangels Faktor -> loginContextOrSkip skippt statt gruen).
      - name: Seed Kasko-Reparatur-Fixture (J5)
        run: node scripts/smoke/kasko-reparatur-seed.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fundament Journey-Smoke J5 (Kasko-Reparatur-Phase)
        run: npx playwright test kasko-reparatur-phase-smoke --project=chromium --reporter=line
        env:
          RUN_KASKO_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      # Fundament Journey-Suite J10 (Dispatch/Werkstatt-Finder) — S1 (Kunde-Fallakte fiktiv -> Finder
      # erscheint + Werkstatt-Auswahl schreibt reparatur_werkstatt_id) + S3 (Werkstatt-Portal zeigt den
      # zugewiesenen Auftrag). Seed legt je Lauf Wegwerf-Kunde + eigene Wegwerf-Werkstatt (email=NULL fuer
      # nurEchte-Sichtbarkeit) + S1-Claim (fiktiv+selbstzahler, unzugewiesen) + S3-Claim (zugewiesen) an,
      # self-cleaning via Marker. Ersetzt die tote Fixture badecb82 + den festen prod-Kunden. S2 (Flow-
      # Wizard) = fragile 14-Schritt-Heuristik -> test.skip in der Spec. RUN_WF_SMOKE gatet den Spec;
      # SUPABASE_SERVICE_ROLE_KEY im Test-Step, weil die Spec db() fuer die Verify-Reads nutzt (anders als J5).
      - name: Seed Werkstatt-Finder-Fixture (J10)
        run: node scripts/smoke/werkstatt-finder-seed.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fundament Journey-Smoke J10 (Werkstatt-Finder)
        run: npx playwright test werkstatt-finder-smoke --project=chromium --reporter=line
        env:
          RUN_WF_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Fundament Journey-Suite J3 (Unterschriften SA/Vollmacht) — der SA-Signatur-Weg konvertiert einen
      # Lead zu einem Claim mit sa_unterschrieben=true. Seed legt je Lauf einen Wegwerf-Lead im
      # WerkstattIntake-SA-offen-Zustand (werkstatt_intake_am) + flow_link an (Kunde-Account entsteht erst
      # beim Signieren); der Spec faehrt /flow/[token] ANON (kein Login/Auth-Wall) -> Canvas + Checkbox +
      # "SA unterzeichnen" -> DB-Verify claims.sa_unterschrieben. self-cleaning via Marker + email-Muster.
      # Die Vollmacht ist server-intern (kein Canvas) -> nicht Teil des UI-Smokes (Journey j03 Schritt 3).
      # RUN_SA_SMOKE gatet; SUPABASE_SERVICE_ROLE_KEY fuer den db()-Verify-Read.
      - name: Seed SA-Vollmacht-Fixture (J3)
        run: node scripts/smoke/sa-vollmacht-seed.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fundament Journey-Smoke J3 (SA-Unterschrift)
        run: npx playwright test sa-vollmacht-smoke --project=chromium --reporter=line
        env:
          RUN_SA_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Fundament Journey-Suite J6 (Kanzlei-Übergabe) — der Kunde übergibt seinen Fall an die eigene
      # Kanzlei ("Kanzleipaket versenden") -> claims.operative_status='an_externe_kanzlei_uebergeben'.
      # Seed legt je Lauf einen Wegwerf-Claim im übergabe-bereiten Zustand an (haftpflicht + komplett +
      # eigene_kanzlei + Ansprechpartner-Mail @claimondo.test + freigegebenes Erstgutachten als Button-Gate),
      # self-cleaning via Marker. Externer Kunde-Login (kein Auth-Wall, keine echte Kanzlei-Gegenseite).
      # RUN_KANZLEI_SMOKE gatet; SUPABASE_SERVICE_ROLE_KEY fuer den db()-Verify (toPass-Poll, PDF-Gen dauert).
      - name: Seed Kanzlei-Uebergabe-Fixture (J6)
        run: node scripts/smoke/kanzlei-uebergabe-seed.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fundament Journey-Smoke J6 (Kanzlei-Uebergabe)
        run: npx playwright test kanzlei-uebergabe-smoke --project=chromium --reporter=line
        env:
          RUN_KANZLEI_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Fundament Journey-Suite J7 (Storno/DSGVO-Loeschung) — beide Ausstiege: A Storno ist INTERN
      # (Admin/KB; markClaimAsStorniert via EndzustandDropdown in /faelle/[id] — j07 "Kunde storniert"
      # hat keine Kunde-UI) -> operative_status='storniert'. B DSGVO 2-Schritt: Kunde-Antrag
      # (/kunde/profil) -> Admin BESTAETIGT -> "Direkt ausfuehren" (rpc-Anonymisierung + Auth-Delete).
      # Bestaetigen MUSS vor Ausfuehren (chk_bestaetigt_logic verlangt bestaetigt_am — sonst Silent-
      # CHECK-Reject des Status-Writes). IRREVERSIBEL nur fuer die 3 eigenen Wegwerf-Konten des Seeds
      # (Throwaway-Admin + Storno-Kunde + DSGVO-Kunde, getrennt); die Admin-Zeile wird per EXAKTER
      # Wegwerf-Email getargetet, nie "erste Zeile". Admin-Creds kommen aus dem Seed-JSON (KEIN
      # TEST_ADMIN_*-Secret noetig, kein TOTP). RUN_STORNO_DSGVO_SMOKE gatet; SERVICE_ROLE fuer db().
      - name: Seed Storno/DSGVO-Fixture (J7)
        run: node scripts/smoke/storno-dsgvo-seed.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fundament Journey-Smoke J7 (Storno/DSGVO)
        run: npx playwright test storno-dsgvo-smoke --project=chromium --reporter=line --workers=1
        env:
          RUN_STORNO_DSGVO_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # J7-Nachlauf: Wegwerf-ADMIN-Konto + Smoke-Antraege nicht bis zum naechsten Lauf liegen lassen
      # (Admin-Rolle ist sensibler als die Wegwerf-Kunden der anderen Journeys) — laeuft auch bei
      # rotem Smoke; Debugging nutzt eh den lokalen Re-Run mit frischem Seed.
      - name: Cleanup Storno/DSGVO-Fixture (J7)
        if: always()
        run: node scripts/smoke/storno-dsgvo-seed.mjs --clean
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Fundament Journey-Suite J2 (Meldung alle Kanaele) — 3 Meldewege = 3 Melde-Muster:
      # A Kunde-Wizard /kunde/schaden-melden (Wrapper: leads+claims+pflichtdok, keine Terminwahl,
      # kein reserviere()) · B POST /api/v1/melde-schaden (lead-first: gfa+lead+flow_link; 2. POST
      # beweist j02-Dedup 'bereits_angelegt'; Assert kanal='none' = Runtime-Send-Isolations-Beweis
      # der Drama-Festnetznummer) · C Gegner-Schadenkarte /schaden/[token] (Kern-direkt: Direkt-Claim
      # + verursacher-Party + interner vs_meldung-Task; OHNE Telefon, OHNE Versicherer — VS-Meldung
      # ist prod-scharf, /unfallmeldung wird NICHT bestaetigt). Isolation identitaetsbasiert
      # (@claimondo.test/telefon=NULL/Drama-Nummer) — SIDE_EFFECT_MODE erreicht den prod-Prozess nicht.
      - name: Seed Meldung-Kanaele-Fixture (J2)
        run: node scripts/smoke/meldung-kanaele-seed.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fundament Journey-Smoke J2 (Meldung alle Kanaele)
        run: npx playwright test meldung-kanaele-smoke --project=chromium --reporter=line --workers=1
        env:
          RUN_MELDUNG_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Read-only-Opt-in-Smokes (20.08.2026): zwei Specs, die bisher NIE automatisch liefen.
      #
      # Die Suite hat 26 `RUN_*`-Schalter, dieser Job setzt 9 — die uebrigen 16 (20 Specs)
      # liefen automatisch nie. Ob das gewollt ist, war offen. Am 20.08. jede Spec einzeln
      # geprueft (DB-Write / HTTP-Write / service-role / mutierender Klick):
      #   18 von 20 mutieren auf prod -> Deaktivierung BERECHTIGT, bleiben opt-in.
      #    1 laeuft ohnehin nicht (kunde-auth-setup steht im testIgnore der Config).
      #    2 sind read-only — genau diese beiden hier.
      #
      # Beide vorher gegen prod gefahren, damit hier kein ungeprueftes Rot einzieht:
      #   smoke-vertrieb-prod       gruen, 23,0 s  (/admin/vertrieb: Switch, Rolle-Filter,
      #                             Roster 96 Zellen, Liste/Karte-Toggle)
      #   phone-login-card-smoke    gruen,  3,8 s  (Telefon-Login-Karte im KontoSicherheitPanel)
      # Zusammen ~27 s — der Job hat seit dem Cap-Fix (#5422) reichlich Luft.
      #
      # ⚠ Kein Secret fuer phone-login: der Spec faellt auf test-dispatch@ + `Test1234!`
      # zurueck, und genau das ist dort korrekt (die dokumentierte Ausnahme, s. #5442).
      # Ein durchgereichtes Secret mit veraltetem Wert wuerde den korrekten Default
      # ueberschreiben — deshalb bewusst NICHT gesetzt.
      #
      # ⚠ NICHT hier aufnehmen: smoke-orchestrator-prod. Er klickt "Verwerfen" (mutiert) und
      # ist gegen prod rot — er findet die Vorschlags-Karten, laeuft danach aber in den
      # Test-Timeout. Befund fuer die Admin-/AI-Lane, kein CI-Kandidat.
      - name: Read-only-Prod-Smokes (Vertrieb-Konsole + Telefon-Login-Karte)
        run: npx playwright test smoke-vertrieb-prod phone-login-card-smoke --project=chromium --reporter=line --workers=1
        env:
          RUN_VERTRIEB_SMOKE: '1'
          RUN_PHONE_LOGIN_CARD_SMOKE: '1'
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Run E2E Tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://app.claimondo.de
          # Dieser Sammel-Lauf kommt NACH den Journey-Steps und fasst dieselben Specs ein
          # zweites Mal an — auf einem Seed-Zustand, den der Journey-Step bereits verbraucht
          # hat. J4 (reparatur-weg-e2e-smoke) laedt den KVA hoch UND gibt ihn frei; beim
          # zweiten Durchgang fehlt darum der Button „Kostenvoranschlag hochladen".
          # Belegt am nightly vom 21.08. (Lauf 32445807331): J4-Step gruen, im Sammel-Lauf
          # DREI rote Tests, die sich diese eine Fixture teilen — reparatur-weg-e2e-smoke,
          # -kva-betrag-pflicht und -kva-ablehnung-loop. Der Page-Snapshot zeigt „KVA
          # freigegeben", also kein Selektor-Problem, sondern ein verbrauchter Ausgangszustand.
          # Die Specs skippen hier jetzt mit sichtbarer Begruendung statt in Timeouts zu laufen.
          # ⚠ Bewusst als LISTE, nicht pauschal: nur Fixtures, deren Zustand in DIESEM Lauf
          # nachweislich verbraucht wurde. Alle uebrigen Seed-Specs laufen unveraendert.
          # ⚠ OFFEN: -kva-betrag-pflicht und -kva-ablehnung-loop haben KEINEN eigenen
          # Journey-Step und werden damit nirgends mehr scharf geprueft. Sie brauchen je einen
          # eigenen Seed-Lauf (das Seed-Script ist re-runnable: frische FIN pro Lauf, raeumt
          # Reste > 1 h selbst auf) — das ist eine Entscheidung mit prod-Datenwirkung und
          # gehoert der Reparatur-Lane, nicht diesem Fix.
          E2E_SEEDS_VERBRAUCHT: '.reparatur-weg-e2e-seed.json'
          # Fundament B2: J1-Journey-Oracle (Status-Tiefe) aktivieren. golden-path-deep-prod
          # nutzt _golden-path-lib ROLES (kunde=smoke-kunde@, korrekt) + skipIfAuthWall fuer
          # interne Rollen (2FA-Wand -> skip statt fail). Der flache golden-path-prod bleibt
          # bewusst aus (eigene ROLES=totes test-kunde@, kein skipIfAuthWall -> wuerde failen).
          RUN_GOLDEN_PATH_DEEP: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          # Interne Rollen (admin/kb/dispatch/sv) brauchen ein TOTP-Secret fuer aal2 (2FA #3745).
          # Fehlt es, bleibt der Login aal1 -> skipIfAuthWall ueberspringt den Test (kein Fehler,
          # aber auch KEIN gruener Smoke). Nur die TOTP-Secrets durchreichen: die sind ECHTE no-ops
          # solange unbesetzt (undefined -> MFA-Skip). Passwoerter BEWUSST NICHT hier durchreichen —
          # ein unbesetztes Secret rendert als '' und `?? 'Test1234!'` faengt '' NICHT ab, wuerde also
          # den Default ueberschreiben. KB/Dispatch/Admin nutzen so den grandfatherten Default
          # 'Test1234!' (bzw. TEST_ADMIN_PASSWORD, das oben steht; TEST_SV_PASSWORD wurde am
          # 21.08. entfernt — s. Begruendung dort).
          # Setup (Secrets + Prod-Test-Accounts): docs/2026-07-14-regel4-e2e-totp-secrets-setup.md
          TEST_ADMIN_TOTP_SECRET: ${{ secrets.TEST_ADMIN_TOTP_SECRET }}
          TEST_KB_TOTP_SECRET: ${{ secrets.TEST_KB_TOTP_SECRET }}
          TEST_DISPATCH_TOTP_SECRET: ${{ secrets.TEST_DISPATCH_TOTP_SECRET }}
          # 21.08.: TEST_SV_EMAIL/_PASSWORD BEWUSST NICHT MEHR durchgereicht — aus genau dem
          # Grund, der zwei Bloecke weiter unten schon fuer KB/Dispatch/Kanzlei steht: ein
          # unbesetztes Secret rendert als '' und ueberschreibt damit den (korrekten) Default.
          # Belegt am ersten vollstaendig durchgelaufenen nightly (Lauf 32445807331): genau die
          # 8 `Gutachter Routes` in routes.spec.ts rot, je ~17 s Timeout — waehrend dieselben
          # 8 Tests LOKAL gegen dieselbe prod-Instanz in 20,1 s gruen sind (frischer Login,
          # playwright/.auth geloescht). Gleicher Code, gleiche Seiten; der einzige Unterschied
          # war dieses Secret. Admin bleibt durchgereicht — dort traegt es nachweislich einen
          # gueltigen Wert (Admin-Routen sind gruen).
          # Das TOTP-Secret bleibt: es ist ein echtes no-op, solange unbesetzt (undefined -> MFA-Skip).
          TEST_SV_TOTP_SECRET: ${{ secrets.TEST_SV_TOTP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # CalDAV-Smoke (smoke-caldav-*.spec.ts) — ohne diese ENVs werden die
          # Specs via test.skip() übersprungen statt den Worker zu crashen.
          STAGING_BASIC_USER: ${{ secrets.STAGING_BASIC_USER }}
          STAGING_BASIC_PASS: ${{ secrets.STAGING_BASIC_PASS }}
          SV_EMAIL: ${{ secrets.SV_EMAIL }}
          SV_PASS: ${{ secrets.SV_PASS }}

      # ⚠ `failure()` allein reicht NICHT: ein Job-Timeout endet als `cancelled`, nicht als
      # `failure` — der Report wurde dabei also gerade dann NICHT hochgeladen, wenn man ihn
      # am dringendsten braucht. Belegt am 19. + 20.08.: beide nightly-Laeufe liefen in das
      # 45-min-Cap, beide Uploads standen auf `skipped`, es gab keinerlei Diagnose darueber,
      # wie weit die Suite gekommen war. `cancelled()` deckt genau diesen Fall mit ab.
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Traces
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
