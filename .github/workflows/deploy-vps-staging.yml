name: Deploy → VPS (staging.app.claimondo.de)

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          # Heap auf 6 GB hochziehen — Next.js 16 Turbopack mit
          # ~600+ Routes + TS-Strict-Check braucht > 4 GB Default.
          NODE_OPTIONS: --max-old-space-size=6144
          # NEXT_PUBLIC_* werden zur Build-Zeit in den Client-Bundle gebaked.
          # Hier zeigt NEXT_PUBLIC_APP_URL auf staging.app.claimondo.de —
          # damit landen Magic-Links / Redirects nach Login auf der
          # Staging-Domain statt auf Production.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL_STAGING }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_3D_TILES_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_3D_TILES_KEY }}
          NEXT_PUBLIC_HERE_API_KEY: ${{ secrets.NEXT_PUBLIC_HERE_API_KEY }}
          NEXT_PUBLIC_CESIUM_ION_TOKEN: ${{ secrets.NEXT_PUBLIC_CESIUM_ION_TOKEN }}
          NEXT_PUBLIC_CESIUM_ION_ASSET_ID: ${{ secrets.NEXT_PUBLIC_CESIUM_ION_ASSET_ID }}
          NEXT_PUBLIC_FELDMODUS_CESIUM_TILES: ${{ secrets.NEXT_PUBLIC_FELDMODUS_CESIUM_TILES }}
          NEXT_PUBLIC_FELDMODUS_GOOGLE_TILES: ${{ secrets.NEXT_PUBLIC_FELDMODUS_GOOGLE_TILES }}
          NEXT_PUBLIC_IMAGIN_CUSTOMER: ${{ secrets.NEXT_PUBLIC_IMAGIN_CUSTOMER }}
          NEXT_PUBLIC_ELEVENLABS_VOICE_ID: ${{ secrets.NEXT_PUBLIC_ELEVENLABS_VOICE_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Artefakt packen
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf deploy-staging.tar.gz -C .next/standalone .

      - name: Deploy auf VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 212.132.119.110
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy-staging.tar.gz
          target: /tmp/

      - name: Restart staging-Prozess
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.132.119.110
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /var/www/claimondo-v2-staging-new
            tar -xzf /tmp/deploy-staging.tar.gz -C /var/www/claimondo-v2-staging-new
            # 13.05.2026 Prod-Fix: vorher `cp old/.env.local new/.env.local || true`
            # — wenn das alte File fehlte (z. B. nach einem kaputten Deploy davor),
            # schluckte das `|| true` den Fehler und das neue Verzeichnis hatte
            # auch kein .env.local. Beim nächsten PM2-Start fehlte
            # SUPABASE_SERVICE_ROLE_KEY → Kunde-Layout-Crash. Stattdessen jetzt:
            # Symlink auf den kanonischen Ort /etc/claimondo/.env.local
            # (root:root, 600, geteilt mit Prod — staging unterscheidet sich
            # nur via NEXT_PUBLIC_APP_URL_STAGING, das zur Build-Zeit gebaked
            # wird, nicht zur Laufzeit gelesen).
            #
            # ⚠ Das "geteilt mit Prod" war am 13.05. harmlos — Stripe lief im
            # Test-Mode. Seit dem Live-Cutover (27.07.) traegt dieselbe Datei
            # sk_live: staging fuehrt damit ECHTE Zahlungen aus. Gemessen 20.08.
            # Deshalb: optionales Override. Existiert /etc/claimondo/.env.staging,
            # gewinnt sie — sonst unveraendertes Verhalten (nichts bricht).
            if [ ! -f /etc/claimondo/.env.local ]; then
              echo "FATAL: /etc/claimondo/.env.local fehlt — Staging-Deploy abgebrochen."
              echo "Behebung: Aaron muss das File einmalig aus dem letzten guten Backup nach /etc/claimondo/.env.local kopieren (chmod 600, chown root:root)."
              exit 1
            fi
            ENVFILE=/etc/claimondo/.env.local
            if [ -f /etc/claimondo/.env.staging ]; then
              ENVFILE=/etc/claimondo/.env.staging
              echo "Staging-Env: eigenes File (/etc/claimondo/.env.staging)."
            elif grep -q "^STRIPE_SECRET_KEY=sk_live" /etc/claimondo/.env.local 2>/dev/null; then
              # Bewusst nur ein Hinweis, kein exit 1: der Deploy selbst ist in
              # Ordnung, und ein harter Stopp wuerde staging lahmlegen, ohne das
              # eigentliche Problem zu loesen.
              #
              # ⚠ HIER bewusst KEIN "::warning::" — aus der SSH-Sitzung wird es
              # NICHT zur Annotation. appleboy/ssh-action stellt jeder entfernten
              # Zeile "out: " voran, und GitHub parst Workflow-Kommandos nur am
              # ZEILENANFANG. Gemessen 20.08. an Run 32399568140: die Zeile stand
              # im Log, die einzige Annotation des Jobs war "Node.js 20 is
              # deprecated". Die echte Warnung entsteht im Runner-Schritt unten.
              echo "HINWEIS: staging laeuft mit STRIPE-LIVE-KEY (Details siehe Job-Annotation)."
            fi
            ln -sf "$ENVFILE" /var/www/claimondo-v2-staging-new/.env.local
            rm -rf /var/www/claimondo-v2-staging-old 2>/dev/null || true
            mv /var/www/claimondo-v2-staging /var/www/claimondo-v2-staging-old 2>/dev/null || true
            mv /var/www/claimondo-v2-staging-new /var/www/claimondo-v2-staging
            # Idempotenter Restart: alle Prozesse mit dem Namen löschen + neu starten.
            # PORT=3001 unterscheidet uns von Production (Port 3000) — nginx
            # routet staging.app.claimondo.de auf 3001.
            pm2 delete claimondo-v2-staging 2>/dev/null || true
            # TZ=Europe/Berlin: Node-Prozess auf deutsche Zeit pinnen (siehe Prod-Deploy).
            TZ=Europe/Berlin PORT=3001 pm2 start /var/www/claimondo-v2-staging/server.js \
              --name claimondo-v2-staging \
              --env production \
              --max-memory-restart 1400M \
              --cwd /var/www/claimondo-v2-staging
            pm2 save
            rm -f /tmp/deploy-staging.tar.gz
            echo "Staging-Deploy $(date) abgeschlossen"

      # ── Stripe-Live-Key-Warnung ────────────────────────────────────────────
      # Zweistufig, weil ein "::warning::" AUS der SSH-Sitzung nie ankommt:
      # appleboy/ssh-action praefixt jede entfernte Zeile mit "out: ", und
      # GitHub erkennt Workflow-Kommandos nur am Zeilenanfang. Belegt am
      # 20.08. (Run 32399568140): 2 ausgegebene "::warning::"-Zeilen im Log,
      # 0 davon in der Annotations-API des Jobs.
      #
      # Deshalb: der Check laeuft remote und signalisiert nur ueber seinen
      # EXIT-CODE; die Warnung selbst entsteht im Runner-Schritt danach.
      # continue-on-error, damit dieser Check den Deploy nie kippen kann —
      # der Deploy ist in Ordnung, es fehlt nur ein Test-Key.
      - name: Stripe-Key auf staging pruefen
        id: stripecheck
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.132.119.110
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ -f /etc/claimondo/.env.staging ]; then exit 0; fi
            if grep -q "^STRIPE_SECRET_KEY=sk_live" /etc/claimondo/.env.local 2>/dev/null; then exit 42; fi
            exit 0

      - name: Warnung — staging faehrt mit Stripe-LIVE-Key
        if: steps.stripecheck.outcome == 'failure'
        run: |
          echo "::warning::STAGING LAEUFT MIT STRIPE-LIVE-KEY. Eine Test-Zahlung auf staging.app.claimondo.de ist eine ECHTE Zahlung auf dem K&S-UG-Live-Konto. Insbesondere der offene J8-Checkout-Smoke wuerde eine echte Abbuchung ausloesen."
          echo "::warning::Behebung: /etc/claimondo/.env.staging anlegen (Kopie der .env.local mit STRIPE_SECRET_KEY / NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY / STRIPE_WEBHOOK_SECRET auf Test-Werte). Der Deploy nimmt sie dann automatisch."
