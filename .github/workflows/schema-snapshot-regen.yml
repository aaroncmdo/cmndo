# Naechtlicher Regen der Write-Achsen-Ground-Truth (scripts/lib/schema-snapshot.json) aus prod.
# Motivation: der Snapshot driftete 2x in 12h still (claims.status/finance_eintraege-Drops), weil
# "jede Migration zieht den Snapshot nach" im Multi-Session-Betrieb nicht haelt. Dieser Job faengt
# Drift automatisch + oeffnet EINEN rollierenden PR gegen staging.
#
# ⚙️ SETUP (einmalig, Aaron): zwei Repo-Secrets setzen —
#   NEXT_PUBLIC_SUPABASE_URL   = die prod-REST-URL (https://paizkjajbuxxksdoycev.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY  = prod service-role key (READ-only genutzt: nur OpenAPI-Schema-Fetch)
# Ohne die Secrets skippt der Regen sichtbar (kein rotes Failing). Bewusste Policy-Ausnahme
# (sonst "keine DB-Creds in CI") — Aaron 17.07. freigegeben, minimaler Scope: nur dieser Job liest
# das Schema (keine Daten-Reads, kein Write auf die DB).
#
# ⚙️ OPTIONAL (3. Secret, beendet den manuellen-Sync-Treadmill): SNAPSHOT_REGEN_PAT —
#   ein Fine-Grained-PAT, Scope BEWUSST minimal: NUR dieses Repo, "Contents: read/write" +
#   "Pull requests: read/write", sonst NICHTS. Ist er gesetzt, oeffnet der Job den Drift-PR
#   selbst (PAT-Actor triggert CI, anders als der Default-GITHUB_TOKEN). Der PR wird weiterhin
#   VON HAND gereviewt+gemergt — nur das manuelle Anlegen entfaellt (Review-Gate bleibt).
#   Vorteil ggue. dem Repo-Setting "Allow Actions to create and approve PRs": KEIN Self-Approve-
#   Risiko (das Setting erlaubt Actions auch, fremde PRs zu approven — ein PAT nur PR-anlegen).
#   Ist er NICHT gesetzt, faellt der Job auf den Default-Token zurueck = heutiges Verhalten
#   (Branch gepusht, PR manuell via 1-Klick-Link). Der `|| secrets.GITHUB_TOKEN`-Fallback macht
#   das Setzen zu einem risikofreien No-op bis der PAT existiert.
name: schema-snapshot-regen

on:
  schedule:
    - cron: '17 3 * * *' # taeglich 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schema-snapshot-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Kein npm ci noetig — das Script nutzt nur Node-Builtins (fs/path/url/fetch).
      - name: Snapshot aus prod regenerieren
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/build-schema-snapshot.mjs
      - name: Bei Drift rollierenden PR gegen staging
        env:
          # PAT wenn gesetzt (oeffnet PR + triggert CI, ohne das Self-Approve-Repo-Setting),
          # sonst Default-Token = heutiges Verhalten (Branch-Push + manueller PR). Risikofreies No-op
          # bis SNAPSHOT_REGEN_PAT existiert. Ein ungueltiger/abgelaufener PAT degradiert ebenfalls
          # sauber: `gh pr create` failt -> der `else`-Zweig unten warnt (kein rotes Failing).
          GH_TOKEN: ${{ secrets.SNAPSHOT_REGEN_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- scripts/lib/schema-snapshot.json; then
            echo "Kein Drift — nichts zu tun."
            exit 0
          fi
          echo "Drift erkannt — rollierender PR."
          BRANCH=chore/schema-snapshot-regen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add scripts/lib/schema-snapshot.json
          git commit -m "chore(query-parse): schema-snapshot regen (auto — Drift erkannt)"
          git push -f -u origin "$BRANCH"
          # PR-Auto-Erstellung ist OPTIONAL. Zwei Wege sie zu aktivieren:
          #  (a) SNAPSHOT_REGEN_PAT-Secret (EMPFOHLEN, s. Header) — der PAT-Actor legt den PR an;
          #      kein Self-Approve-Risiko, PR triggert CI.
          #  (b) Repo-Setting "Allow GitHub Actions to create and approve pull requests"
          #      (Settings → Actions → General) — ⚠ erlaubt Actions auch das Approven fremder PRs.
          # Ist KEINS aktiv, failt `gh pr create` mit "GitHub Actions is not permitted to create
          # pull requests" — dann NICHT den Job rot faerben: der Branch ist gepusht (= Drift
          # erfasst), PR wird manuell via 1-Klick-Link geoeffnet.
          echo "### 🔁 Schema-Snapshot-Drift — Branch \`$BRANCH\` gepusht" >> "$GITHUB_STEP_SUMMARY"
          BODY="Automatischer Regen von scripts/lib/schema-snapshot.json aus prod (Cron). Drift zur committeten Write-Achsen-Ground-Truth erkannt. Reiner Snapshot-Sync, kein Code (Regel 4 n/a). Review: gelistete Tabellen/Spalten gegen die zugehoerige Migration; NEUE Relationen default kind=t (falls View -> manuell v)."
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$OPEN" != "0" ]; then
            echo "Rollierender PR existiert bereits → per force-push aktualisiert." | tee -a "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base staging --head "$BRANCH" --title "chore(query-parse): schema-snapshot regen (auto)" --body "$BODY"; then
            echo "✅ PR automatisch erstellt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Auto-PR nicht erlaubt (Repo-Setting aus). Branch gepusht — PR manuell oeffnen: https://github.com/${GITHUB_REPOSITORY}/pull/new/$BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
